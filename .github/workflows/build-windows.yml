name: Build Qt 5.15 App for Windows

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'          # Запуск при создании тегов вида v1.0.0
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Сборка под Windows (MSVC)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. Обновлено до v4 (поддерживает Node 24)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Обновлено до v4 (поддерживает Node 24)
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        aqtversion: '==3.1.19' # Фикс для ошибки парсинга qtbase в Qt 5.15.x
        cache: true
        cache-key-prefix: 'qt-5.15.2-win64-msvc2019'

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Deploy Qt Dependencies
      run: |
        cd build/Release
        windeployqt af_weigand_sender.exe --no-compiler-runtime --no-system-d3d-compiler

    - name: Package Application
      run: |
        mkdir ReleasePackage
        Copy-Item -Path "build/Release/*" -Destination "ReleasePackage" -Recurse
        Compress-Archive -Path "ReleasePackage\*" -DestinationPath "af_weigand_sender_Windows.zip"

    # 3. Обновлено до v4 (поддерживает Node 24)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: af_weigand_sender_Windows_Release
        path: af_weigand_sender_Windows.zip
        retention-days: 30

    # 4. Обновлено до v2 (поддерживает Node 24)
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: "Автоматическая сборка af_weigand_sender для Windows (Qt 5.15.2)"
        files: af_weigand_sender_Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
