name: Build Qt 5.15 App for Windows

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'          # Запуск при создании тегов вида v1.0.0
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Сборка под Windows (MSVC)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. Обновлено до v4 (поддерживает Node 24)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Обновлено до v4 (поддерживает Node 24)
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        aqtversion: '==3.1.19' # Фикс для ошибки парсинга qtbase в Qt 5.15.x
        cache: true
        cache-key-prefix: 'qt-5.15.2-win64-msvc2019'

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Deploy Qt Dependencies
      run: |
        cd build/Release
        windeployqt af_weigand_sender.exe --no-compiler-runtime --no-system-d3d-compiler

    - name: Package Application with Release Version
      run: |
        $RELEASE_VERSION = "${{ github.ref_name }}"

        $NEW_EXE_NAME = "af_weigand_sender_${RELEASE_VERSION}.exe"
        $ARCHIVE_NAME = "af_weigand_sender_${RELEASE_VERSION}_Windows.zip"
        
        mkdir ReleasePackage
        Copy-Item -Path "build/Release/*" -Destination "ReleasePackage" -Recurse
        
        Rename-Item -Path "ReleasePackage\af_weigand_sender.exe" -NewName $NEW_EXE_NAME
        
        Compress-Archive -Path "ReleasePackage\*" -DestinationPath $ARCHIVE_NAME
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $env:GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: af_weigand_sender_${{ github.ref_name }}_Release
        path: ${{ env.ARCHIVE_NAME }}
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: "Автоматическая сборка af_weigand_sender для Windows (Qt 5.15.16). Версия: ${{ github.ref_name }}"
        files: ${{ env.ARCHIVE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Не забываем про права на запись, которые мы добавляли ранее:
        # permissions:
        #   contents: write  (этот блок должен быть на уровне jobs: build-windows:)

    # 3. Обновлено до v4 (поддерживает Node 24)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: af_weigand_sender_Windows_Release
        path: af_weigand_sender_Windows.zip
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: "Автоматическая сборка af_weigand_sender для Windows (Qt 5.15.2). Версия: ${{ github.ref_name }}"
        files: ${{ env.ARCHIVE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
