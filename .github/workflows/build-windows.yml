name: Build Qt App for Windows

# Триггеры: когда запускать этот скрипт
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Сборка под Windows
    runs-on: windows-latest # GitHub предоставит свежую Windows Server

    steps:
    # 1. Скачиваем ваш код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем Qt
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: '==3.1.19'
        version: '5.15.2'               # Укажите нужную вам версию Qt
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'      # Архитектура (win64_mingw_64, если хотите MinGW)

    # 3. Настраиваем CMake
    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    # 4. Собираем проект
    - name: Build
      run: cmake --build build --config Release
      
    - name: Deploy Qt Dependencies
      run: |
        cd build/Release
        windeployqt af_weigand_sender.exe --no-compiler-runtime --no-system-d3d-compiler

    - name: Package Application
      run: |
        mkdir ReleasePackage
        Copy-Item -Path "build/Release/*" -Destination "ReleasePackage" -Recurse
        Compress-Archive -Path "ReleasePackage\*" -DestinationPath "af_weigand_sender_Windows.zip"

    # 5. Упаковываем и сохраняем готовый .exe файл (Артефакт)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: af_weigand_sender              # Имя архива, который вы скачаете
        path: af_weigand_sender_Windows.zip  # Путь к вашему .exe файлу (скорректируйте под свой проект)
        retention-days: 7                    # Сколько дней хранить файл (макс. 90)
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: "Автоматическая сборка af_weigand_sender для Windows (Qt 5.15.16)"
        files: af_weigand_sender_Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
